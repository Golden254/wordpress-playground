name: Build Playground Runtime Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Playground website
        run: npm run build:website

      - name: Package Playground runtime
        run: |
          cd dist/packages/playground/wasm-wordpress-net
          zip -r "$GITHUB_WORKSPACE/playground-runtime.zip" .

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-playground-runtime
          path: playground-runtime.zip
          retention-days: 7
