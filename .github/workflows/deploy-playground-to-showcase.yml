name: Deploy Playground to Showcase

on:
  workflow_run:
    workflows:
      - Build Playground Runtime Artifact
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download built runtime
        uses: actions/download-artifact@v4
        with:
          name: golden-playground-runtime
          run-id: $&#123;&#123; github.event.workflow_run.id &#125;&#125;
          github-token: $&#123;&#123; secrets.GITHUB_TOKEN &#125;&#125;

      - name: Check archive
        run: |
          ls -lh playground-runtime.zip
          unzip -tq playground-runtime.zip

      - name: Prepare single-file upload
        run: |
          mkdir upload
          cp playground-runtime.zip upload/playground-runtime.zip

      - name: Upload archive using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: $&#123;&#123; secrets.FTP_SERVER &#125;&#125;
          username: $&#123;&#123; secrets.FTP_USERNAME &#125;&#125;
          password: $&#123;&#123; secrets.FTP_PASSWORD &#125;&#125;
          protocol: ftps
          port: $&#123;&#123; secrets.FTP_PORT &#125;&#125;
          local-dir: upload/
          server-dir: ./
          dangerous-clean-slate: false
  
