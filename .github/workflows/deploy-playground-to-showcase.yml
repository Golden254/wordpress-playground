
name: Deploy Playground to Showcase

on:
  workflow_run:
    workflows:
      - Build Playground Runtime Artifact
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download built runtime
        uses: actions/download-artifact@v4
        with:
          name: golden-playground-runtime
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check archive
        run: |
          ls -lh playground-runtime.zip
          unzip -tq playground-runtime.zip
          du -h playground-runtime.zip

      - name: Prepare single-file upload
        run: |
          mkdir upload
          cp playground-runtime.zip upload/playground-runtime.zip

      - name: Upload archive using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT }}
          local-dir: upload/
          server-dir: ./
          dangerous-clean-slate: false
